<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07060b">
<meta name="robots" content="noindex">
<title>Bucket Run | Jenkins Detailing</title>
<style>
  :root {
    --ink: #07060b;
    --ink-2: #0f0d18;
    --bone: #ece7dc;
    --accent: #37c77f;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; background: var(--ink); color: var(--bone); height: 100%; }
  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: Manrope, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    padding: calc(0.9rem + var(--sat)) calc(1.25rem + var(--sar)) 0.9rem calc(1.25rem + var(--sal));
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    border-bottom: 1px solid color-mix(in oklab, var(--bone) 14%, transparent);
  }
  .brand {
    font-family: "Chakra Petch", Manrope, ui-sans-serif, system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--accent);
    padding: 0.15rem 0.45rem;
    line-height: 1.3;
    white-space: nowrap;
  }
  h1 {
    font-family: "Chakra Petch", Manrope, ui-sans-serif, system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(1rem, 2.6vw, 1.25rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .status { color: color-mix(in oklab, var(--bone) 60%, transparent); font-size: 0.85rem; white-space: nowrap; }
  .status.on { color: var(--accent); }
  main { flex: 1 1 auto; min-height: 0; position: relative; background: var(--ink); }
  canvas { display: block; width: 100%; height: 100%; }
  .fallback {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem; text-align: center;
    color: color-mix(in oklab, var(--bone) 60%, transparent);
  }
  .fallback[hidden] { display: none; }
  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.7rem calc(1.25rem + var(--sar)) calc(0.7rem + var(--sab)) calc(1.25rem + var(--sal));
    border-top: 1px solid color-mix(in oklab, var(--bone) 14%, transparent);
    font-size: 0.8rem; color: color-mix(in oklab, var(--bone) 55%, transparent);
  }
  button {
    font: inherit; color: var(--bone); background: transparent; border: 0; cursor: pointer;
    text-decoration: underline; text-decoration-color: color-mix(in oklab, var(--accent) 60%, transparent);
    text-underline-offset: 5px; padding: 0.25rem 0;
  }
  button:hover, button:focus-visible { text-decoration-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 480px) {
    header { flex-wrap: wrap; }
    .status { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">Jenkins Detailing</span>
  <h1>No signal. Keep buffing.</h1>
  <span class="status" id="status" role="status" aria-live="polite">Bucket Run</span>
</header>
<main>
  <canvas id="game" role="img" aria-label="Bucket Run, an endless street run. Jump the bins, duck the pigeons."></canvas>
  <p class="fallback" id="fallback" hidden>The game could not start on this device.</p>
</main>
<footer>
  <span>Reloads when you are back online</span>
  <button type="button" id="retry">Retry</button>
</footer>
<script>{{SCRIPT}}</script>
<script>
(function () {
  var canvas = document.getElementById("game");
  var status = document.getElementById("status");
  var retry = document.getElementById("retry");
  var fallback = document.getElementById("fallback");
  var game = null;
  try {
    if (typeof window.createGame === "function") {
      game = window.createGame(canvas, { storageKey: "jd:play" });
    } else {
      fallback.hidden = false;
    }
  } catch (e) {
    fallback.hidden = false;
  }

  var checking = false;
  function reachable() {
    return fetch(location.href, { method: "HEAD", cache: "no-store" })
      .then(function (r) { return r.ok || (r.status >= 300 && r.status < 500); })
      .catch(function () { return false; });
  }
  function reconnect(fromButton) {
    if (checking) return;
    checking = true;
    if (fromButton) status.textContent = "Checking";
    reachable().then(function (ok) {
      checking = false;
      if (ok) {
        status.textContent = "Back online";
        status.classList.add("on");
        setTimeout(function () { location.reload(); }, 800);
      } else if (fromButton) {
        status.textContent = "Still no signal";
        setTimeout(function () { status.textContent = "Bucket Run"; }, 1600);
      }
    });
  }
  window.addEventListener("online", function () { reconnect(false); });
  // The online event only fires after an offline one. A captive portal, an outage, or a
  // shell served by mistake never flips it, so also probe quietly while the browser thinks
  // it is online: once soon after load, then every ten seconds.
  function probe() { if (navigator.onLine) reconnect(false); }
  setTimeout(probe, 3000);
  setInterval(probe, 10000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") probe();
  });
  retry.addEventListener("click", function () { reconnect(true); });
  // A tap on Retry must not double as a jump.
  retry.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  retry.addEventListener("keydown", function (e) { e.stopPropagation(); });
  window.addEventListener("pagehide", function () { if (game) game.destroy(); });
})();
</script>
</body>
</html>
